<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Montar treino</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/app.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar bg-white border-bottom sticky-top">
  <div class="container py-2 d-flex justify-content-between align-items-center">
    <a href="/" class="btn btn-sm btn-outline-secondary">← Biblioteca</a>
    <span class="navbar-brand fw-semibold">📋 Montar treino</span>
    <span></span>
  </div>
</nav>

<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title mb-3">Dados do aluno</h5>

      <form method="POST" class="vstack gap-4" id="treino-form">
        <div class="row g-3">
          <div class="col-12 col-md-4">
            <label class="form-label">Nome do aluno</label>
            <input class="form-control" name="aluno" placeholder="Ex: Ana Souza" required>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label">Objetivo do treino</label>
            <input class="form-control" name="objetivo" list="objetivos-list" placeholder="Ex: Hipertrofia" required>
            <datalist id="objetivos-list">
              <option value="Hipertrofia"></option>
              <option value="Emagrecimento"></option>
              <option value="Reabilitação"></option>
              <option value="Condicionamento"></option>
              <option value="Força"></option>
            </datalist>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label">Grupo de músculos</label>
            <input class="form-control" name="grupo" list="grupos-list" placeholder="Ex: Glúteos" required>
            <datalist id="grupos-list">
              {% for g in grupos %}
              <option value="{{ g }}"></option>
              {% endfor %}
            </datalist>
          </div>
        </div>

        <div>
          <h5 class="card-title mb-2">Exercícios</h5>
          <p class="text-muted small mb-3">Selecione os exercícios da biblioteca e defina séries e repetições.</p>

          <div id="exercicios-container" class="vstack gap-3">
            <div class="row g-2 align-items-end exercicio-row">
              <div class="col-12 col-md-6">
                <label class="form-label">Exercício</label>
                <select class="form-select" name="exercicio_id[]" required>
                  <option value="">Selecione...</option>
                  {% for ex in exercicios %}
                  <option value="{{ ex.id }}">{{ ex.nome }} ({{ ex.grupo }})</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-6 col-md-3">
                <label class="form-label">Séries</label>
                <input class="form-control" name="series[]" placeholder="Ex: 4" required>
              </div>
              <div class="col-6 col-md-3">
                <label class="form-label">Repetições</label>
                <input class="form-control" name="repeticoes[]" placeholder="Ex: 12" required>
              </div>
            </div>
          </div>

          <div class="mt-3">
            <button class="btn btn-outline-primary btn-sm" type="button" id="add-exercicio">+ Adicionar exercício</button>
          </div>
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-primary" type="submit">Salvar treino</button>
          <a class="btn btn-outline-secondary" href="/">Voltar para biblioteca</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  const container = document.getElementById('exercicios-container');
  const addButton = document.getElementById('add-exercicio');

  addButton.addEventListener('click', () => {
    const rows = container.querySelectorAll('.exercicio-row');
    const lastRow = rows[rows.length - 1];
    const clone = lastRow.cloneNode(true);

    clone.querySelectorAll('input, select').forEach((field) => {
      field.value = '';
    });

    container.appendChild(clone);
  });
</script>

</body>
</html>
