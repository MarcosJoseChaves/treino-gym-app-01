<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/app.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 520px;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">🔐 Acesso do Administrador</h4>
        <p class="text-muted small">Somente o administrador pode ver todos os treinos e respostas dos questionários.</p>

        {% if erro %}
        <div class="alert alert-danger py-2">{{ erro }}</div>
        {% endif %}

        <form method="POST" class="d-grid gap-3">
          <input type="hidden" name="proximo" value="{{ proximo }}">
          <div>
            <label class="form-label">Senha</label>
            <input class="form-control" type="password" name="senha" required>
          </div>
          <button class="btn btn-primary" type="submit">Entrar</button>
          <a class="btn btn-outline-secondary" href="/">Voltar para biblioteca</a>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
