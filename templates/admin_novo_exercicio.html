<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo exercício</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/app.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar bg-white border-bottom sticky-top">
  <div class="container py-2 d-flex justify-content-between align-items-center gap-2 flex-wrap">
    <span class="navbar-brand fw-semibold">➕ Cadastrar exercício</span>
    <div class="d-flex gap-2">
      <a class="btn btn-sm btn-outline-secondary" href="/">Voltar para biblioteca</a>
      <a class="btn btn-sm btn-outline-secondary" href="/admin/exercicios/categorias">Categorias</a>
      <a class="btn btn-sm btn-primary" href="/treino">Montar treino</a>
    </div>
  </div>
</nav>

<div class="container py-3" style="max-width: 900px;">
  <p class="text-muted">Use este formulário para cadastrar novos exercícios no mesmo padrão do arquivo JSON atual e salvar mídia em uma das pastas já existentes.</p>

  {% if erro %}
  <div class="alert alert-danger">{{ erro }}</div>
  {% endif %}

  {% if sucesso %}
  <div class="alert alert-success">{{ sucesso }}</div>
  {% endif %}

  <form method="POST" enctype="multipart/form-data" class="card shadow-sm">
    <div class="card-body row g-3">
      <div class="col-md-6">
        <label class="form-label">Nome do exercício *</label>
        <input class="form-control" name="nome" value="{{ valores.nome }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">ID (opcional, auto-gerado se vazio)</label>
        <input class="form-control" name="id" value="{{ valores.id }}" placeholder="ex: agachamento-sumo">
      </div>

      <div class="col-md-4">
        <label class="form-label">Grupo *</label>
        <select class="form-select" name="grupo" id="novo-exercicio-grupo" required>
          <option value="">Selecione</option>
          {% for g in grupos %}
          <option value="{{ g }}" {% if valores.grupo == g %}selected{% endif %}>{{ g }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Subgrupo *</label>
        <select class="form-select" name="subgrupo" id="novo-exercicio-subgrupo" required>
          <option value="">Selecione</option>
          {% for sg in subgrupos %}
          <option value="{{ sg }}" {% if valores.subgrupo == sg %}selected{% endif %}>{{ sg }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Aparelho *</label>
        <select class="form-select" name="aparelho" id="novo-exercicio-aparelho" required>
          <option value="">Selecione</option>
          {% for a in aparelhos %}
          <option value="{{ a }}" {% if valores.aparelho == a %}selected{% endif %}>{{ a }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Pasta da mídia *</label>
        <select class="form-select" name="pasta_midia" required>
          {% for pasta in pastas_midia %}
          <option value="{{ pasta }}" {% if valores.pasta_midia == pasta %}selected{% endif %}>{{ pasta }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Arquivo de mídia (.gif ou .mp4) *</label>
        <input class="form-control" type="file" name="midia_arquivo" accept=".gif,.mp4" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Dicas (1 por linha)</label>
        <textarea class="form-control" name="dicas" rows="4">{{ valores.dicas }}</textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label">Erros comuns (1 por linha)</label>
        <textarea class="form-control" name="erros" rows="4">{{ valores.erros }}</textarea>
      </div>

      <div class="col-12">
        <label class="form-label">Observações</label>
        <textarea class="form-control" name="observacoes" rows="2">{{ valores.observacoes }}</textarea>
      </div>

      <div class="col-md-4">
        <label class="form-label">Foco (opcional)</label>
        <input class="form-control" name="foco" value="{{ valores.foco }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Músculos secundários (1 por linha)</label>
        <textarea class="form-control" name="musculos_secundarios" rows="3">{{ valores.musculos_secundarios }}</textarea>
      </div>
      <div class="col-md-4">
        <label class="form-label">Instruções (1 por linha)</label>
        <textarea class="form-control" name="instrucoes" rows="3">{{ valores.instrucoes }}</textarea>
      </div>
    </div>
    <div class="card-footer bg-white d-flex justify-content-end">
      <button class="btn btn-primary" type="submit">Salvar exercício</button>
    </div>
  </form>
</div>

<script>
  const grupoSelect = document.getElementById('novo-exercicio-grupo');
  const subgrupoSelect = document.getElementById('novo-exercicio-subgrupo');
  const aparelhoSelect = document.getElementById('novo-exercicio-aparelho');
  const subgruposPorGrupo = {{ subgrupos_por_grupo|tojson }};
  const aparelhosPorFiltros = {{ aparelhos_por_filtros|tojson }};
  const aparelhosCatalogo = {{ aparelhos|tojson }};

  const atualizarSubgrupos = () => {
    if (!subgrupoSelect) return;

    const grupoSelecionado = (grupoSelect?.value || '').trim().toLowerCase();
    const subgrupoAtual = (subgrupoSelect.value || '').trim();
    const subgruposPermitidos = grupoSelecionado
      ? (subgruposPorGrupo[grupoSelecionado] || [])
      : Object.values(subgruposPorGrupo).flat();

    const opcoesUnicas = [...new Set(subgruposPermitidos)].sort((a, b) => a.localeCompare(b));
    subgrupoSelect.innerHTML = '<option value="">Selecione</option>' +
      opcoesUnicas.map((subgrupo) => `<option value="${subgrupo}">${subgrupo}</option>`).join('');

    if (subgrupoAtual && opcoesUnicas.includes(subgrupoAtual)) {
      subgrupoSelect.value = subgrupoAtual;
    }
  };

  const atualizarAparelhos = () => {
    if (!aparelhoSelect) return;

    const grupoSelecionado = (grupoSelect?.value || '').trim().toLowerCase();
    const subgrupoSelecionado = (subgrupoSelect?.value || '').trim().toLowerCase();
    const aparelhoAtual = (aparelhoSelect.value || '').trim();

    let aparelhosPermitidos = [];
    if (grupoSelecionado && subgrupoSelecionado) {
      const chave = `${grupoSelecionado}|||${subgrupoSelecionado}`;
      aparelhosPermitidos = aparelhosPorFiltros.por_grupo_subgrupo[chave]
        || aparelhosPorFiltros.por_subgrupo[subgrupoSelecionado]
        || aparelhosPorFiltros.por_grupo[grupoSelecionado]
        || [];
    } else if (grupoSelecionado) {
      aparelhosPermitidos = aparelhosPorFiltros.por_grupo[grupoSelecionado] || [];
    } else if (subgrupoSelecionado) {
      aparelhosPermitidos = aparelhosPorFiltros.por_subgrupo[subgrupoSelecionado] || [];
    } else {
      aparelhosPermitidos = aparelhosCatalogo || aparelhosPorFiltros.todos || [];
    }

    if (!aparelhosPermitidos || aparelhosPermitidos.length === 0) {
      aparelhosPermitidos = aparelhosCatalogo || [];
    }

    const opcoesUnicas = [...new Set(aparelhosPermitidos)].sort((a, b) => a.localeCompare(b));
    aparelhoSelect.innerHTML = '<option value="">Selecione</option>' +
      opcoesUnicas.map((aparelho) => `<option value="${aparelho}">${aparelho}</option>`).join('');

    if (aparelhoAtual && opcoesUnicas.includes(aparelhoAtual)) {
      aparelhoSelect.value = aparelhoAtual;
    }
  };

  grupoSelect?.addEventListener('change', () => {
    atualizarSubgrupos();
    if (subgrupoSelect) {
      subgrupoSelect.value = '';
    }
    atualizarAparelhos();
  });

  subgrupoSelect?.addEventListener('change', atualizarAparelhos);

  atualizarSubgrupos();
  atualizarAparelhos();
</script>

</body>
</html>
